aid: shortwave
name: Shortwave
description: >-
  Shortwave is an AI-native email client that upgrades an existing Gmail or Google Workspace
  account with a reimagined inbox, built by former members of Google's Inbox team and backed by
  Lightspeed Venture Partners. Its AI assistant drafts and triages email, its AI-powered search
  answers natural-language questions across your mailbox, and it connects to external tools as a
  Model Context Protocol (MCP) client — Shortwave consumes MCP tool calls rather than publishing a
  public developer REST API. Data is hosted on Google Cloud with AES-256 encryption at rest and
  TLS 1.2+ in transit, and the product undergoes annual CASA Tier 2 security audits, with SOC 2
  Type II and GDPR compliance available on request.
